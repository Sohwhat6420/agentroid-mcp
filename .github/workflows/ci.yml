name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version itself comes from rust-toolchain.toml
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - name: Red-team suite (screen guard + audit log)
        run: cargo test -p agentroid-core --test redteam --test redteam_b -- --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: redteam-results
          path: |
            generated/redteam/results.json
            generated/redteam/results.md
            generated/redteam/verify.txt

  rust-linux-build:
    # The portable crates (core, schemas) should build off Windows; the daemon is cfg(windows)-gated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version itself comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p agentroid-core --all-targets

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Offline bench and receipt tests (no emulator, no API key)
        working-directory: bench/androidworld
        run: |
          for t in test_receipts.py test_policy_claude.py test_run_pilot.py test_action_map.py test_integration_fake.py policy-v2/test_policy_claude_v2.py ci/test_ci.py; do
            python -B "$t"
          done
      - run: pip install jsonschema cryptography
      - run: python -B test_schemas.py
      - run: python -B scripts/test_check_dco.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web/jobview
      - run: npm run typecheck
        working-directory: web/jobview
      - run: npm run build
        working-directory: web/jobview
      - run: npm test
        working-directory: web/jobview
      - run: npm run contrast
        working-directory: web/jobview

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/mcp
      - run: npm run typecheck
        working-directory: apps/mcp
      - run: npm test
        working-directory: apps/mcp

  android-helper:
    # The helper APK builds with no Gradle (android/build-helper.sh: aapt2, javac, d8, apksigner). The
    # script joins its classpath with ';', so it runs on Windows. Its three jars come from Maven Central
    # and are checked against the SHA-256s below before anything is compiled. The APK is debug-signed
    # with a throwaway key made in android/out/; the release key never touches CI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (platform 36, build-tools 36.0.0)
        shell: pwsh
        run: |
          $sdkm = Join-Path $env:ANDROID_HOME "cmdline-tools\latest\bin\sdkmanager.bat"
          ("y`n" * 20) | & $sdkm "platforms;android-36" "build-tools;36.0.0" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch and check the three jars
        shell: bash
        run: |
          mkdir -p helper-libs && cd helper-libs
          M=https://repo1.maven.org/maven2
          curl -sfLO "$M/com/squareup/okhttp3/okhttp-jvm/5.5.0/okhttp-jvm-5.5.0.jar"
          curl -sfLO "$M/com/squareup/okio/okio-jvm/3.18.1/okio-jvm-3.18.1.jar"
          curl -sfLO "$M/org/jetbrains/kotlin/kotlin-stdlib/2.1.21/kotlin-stdlib-2.1.21.jar"
          sha256sum -c - <<'SUMS'
          234194a04aac54858df0a750d243af7b2e39df5e4eb86e9912043ad33a9f9a52  okhttp-jvm-5.5.0.jar
          b97b640557a650d15411f2be29aef558c4e422a83653cb18ba494311dbed18be  okio-jvm-3.18.1.jar
          263bdc679e1f62012db7b091796279b6d71cf36f4797a98ff1ace05835f201c8  kotlin-stdlib-2.1.21.jar
          SUMS
      - name: Build the helper APK
        shell: bash
        env:
          HELPER_LIBS: ${{ github.workspace }}/helper-libs
        run: bash android/build-helper.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helper-apk-debug
          path: android/out/helper.apk

  keeper:
    # apps/keeper, the standalone connection keeper: its logic tests run on a plain JVM (no Android SDK, no phone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/keeper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Logic tests
        run: mkdir -p out/test && javac -d out/test src/dev/agentroid/keeper/KeeperLogic.java test/KeeperLogicTest.java && java -cp out/test KeeperLogicTest
      - name: Shell scripts parse
        run: bash -n build.sh && bash -n setup-keeper.sh

  bankguard:
    # apps/bankguard, the bank guard: logic tests on a plain JVM, then the APK (no Gradle), debug-signed with a
    # throwaway key made on the runner. The release key never touches CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bankguard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Logic tests
        run: mkdir -p out/test && javac -d out/test src/dev/agentroid/bankguard/GuardLogic.java test/GuardLogicTest.java && java -cp out/test GuardLogicTest
      - name: Shell scripts parse
        run: bash -n build.sh && bash -n setup-bankguard.sh
      - name: Android SDK packages (platform 36, build-tools 36.0.0)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build the APK
        env:
          BANKGUARD_KEYS_DIR: ${{ runner.temp }}/keys
        run: bash build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bankguard-apk-debug
          path: apps/bankguard/out/bankguard.apk

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python scripts/check_dco.py origin/${{ github.base_ref }}..HEAD
