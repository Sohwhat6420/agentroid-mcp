[package]
name = "agentroid-link-hub"
description = "Laptop end of the persistent phone link (task 2.12, hub half)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "link_hub"
path = "src/lib.rs"

[[bin]]
name = "agentroid-link"
path = "src/bin/agentroid-link.rs"

[dependencies]
agentroid-adb-link = { path = "../adb-link" }
agentroid-credstore = { path = "../credstore" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
# Dependencies (offline cache): the WebSocket server, P-256 ECDSA, futures.
tokio-tungstenite = "=0.30.0"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
# The SHA-256 that p256's `ecdsa` feature already compiles (p256 0.14 does not re-export a
# Sha256 type); listed so the key id can be computed with it. No new crate in Cargo.lock.
sha2 = "=0.11.1"
# The version tungstenite's rand already locks (0.4.3): one getrandom in the build.
getrandom = "0.4"
serde_json = "1"
# TLS 1.3 for --link-lan (ship/NO-ADB-PLAN.md stage 2; his OK to fetch, 11 Nov 2026). ring provider: no cmake/nasm.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading"] }
