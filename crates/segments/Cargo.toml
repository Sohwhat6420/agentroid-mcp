[package]
name = "agentroid-segments"
description = "Task 2.14 hub side: builds, classifies, signs and supervises on-phone runner segments"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P-256 SHA256withECDSA, the same algorithm the link uses (schemas/link.json, android/link LinkCrypto).
# Default features give ecdsa + pkcs8 (SPKI DER in and out) + DER signatures.
p256 = "0.14"
sha2 = "0.11"
base64 = "0.22"
# Key material comes from the OS RNG through getrandom and goes into SigningKey::from_slice (never SigningKey::random).
getrandom = "0.3"
