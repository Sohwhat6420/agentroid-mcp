[package]
name = "agentroid-core"
description = "Transports, selectors, coordinate frames, settle"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agentroid-adb-link = { path = "../adb-link" }
# D3 (10 Nov 2026): the hash-chained audit log. Both are already in Cargo.lock (segments, link-hub).
sha2 = "0.11"
serde_json = "1"

# `agentroid audit verify <log>` (D3)
[[bin]]
name = "agentroid"
path = "src/bin/agentroid.rs"
