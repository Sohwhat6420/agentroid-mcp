[package]
name = "agentroid-sandbox"
description = "run_script sandbox: QuickJS in a child process under a Windows Job Object (task 2.10, slice c)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sandbox"
path = "src/lib.rs"

[[bin]]
name = "agentroid-sandbox"
path = "src/bin/agentroid-sandbox.rs"

[dependencies]
agentroid-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default features only: NOT `rust-alloc`, so QuickJS's own allocator enforces set_memory_limit.
rquickjs = "=0.14.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }
